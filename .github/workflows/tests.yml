name: tests

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        # The unit suite is intentionally light: it exercises pure logic, so it
        # only needs pytest plus the two libraries imported by tested modules
        # (PyQt6.QtCore in update_checker, packaging for version parsing). The
        # heavy app stack (chromadb, torch, fitz, keyring, …) is not required.
        run: |
          python -m pip install --upgrade pip
          pip install pytest packaging PyQt6

      - name: Run test suite
        # QtCore never opens a window, but set the offscreen platform anyway so
        # nothing can try to reach a display on the headless runner.
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -ra

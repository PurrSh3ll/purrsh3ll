[pytest]
# Test discovery is confined to the tests/ tree so pytest never tries to import
# GUI modules (which need a running QApplication) during collection.
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Quiet, informative default output; -ra shows a summary of skips/xfails.
addopts = -ra --strict-markers

markers =
    slow: tests that are noticeably slower (deselect with -m "not slow")
